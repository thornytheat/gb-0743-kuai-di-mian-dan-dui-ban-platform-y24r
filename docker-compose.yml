services:
  app:
    build: .
    ports:
      - "${LABEL_PORT:-18432}:18432"
    environment:
      LABEL_DB: /data/labels.sqlite3
    volumes:
      - label_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18432/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 4
volumes:
  label_data:
